- name: Disable PostgreSQL service (Patroni will control it)
  ansible.builtin.service:
    name: postgresql
    enabled: false
    state: stopped

- name: Remove PostgreSQL data directory
  become: true
  ansible.builtin.file:
    path: "/var/lib/postgresql/17/main"
    state: absent

- name: Install build dependencies for Patroni
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - build-essential
      - libpq-dev
      - libffi-dev
      - libssl-dev
      - python3-dev
      - python3-pip
    state: present
  become: true

- name: Create virtualenv and install Patroni
  ansible.builtin.pip:
    name:
      - patroni[etcd3]
      - psycopg2-binary
    virtualenv: /opt/patroni-venv
    virtualenv_command: python3 -m venv
    state: present
  become: true

- name: Create data and config directories for Patroni
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - /var/lib/postgresql/17/main
    - /etc/patroni

- name: Run pg_basebackup from specified source node (primary source)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      pg_basebackup -h {{ directus_primary_node }} -U replication
      -D /var/lib/postgresql/17/main -Fp -Xs

- name: Ensure correct ownership of the data directory
  become: true
  ansible.builtin.file:
    path: /var/lib/postgresql/17/main
    owner: postgres
    group: postgres
    recurse: true

- name: Slurp postgresql.conf from source host (192.168.56.20)
  ansible.builtin.slurp:
    src: /etc/postgresql/17/main/postgresql.conf
  delegate_to: node1-postgresql
  register: postgresql_conf

- name: Copy postgresql.conf to target
  ansible.builtin.copy:
    content: "{{ postgresql_conf.content | b64decode }}"
    dest: /var/lib/postgresql/17/main/postgresql.conf
    owner: postgres
    group: postgres
    mode: "0600"

- name: Slurp pg_hba.conf from source host (192.168.56.20)
  ansible.builtin.slurp:
    src: /etc/postgresql/17/main/pg_hba.conf
  delegate_to: node1-postgresql
  register: pg_hba_conf

- name: Copy pg_hba.conf to target
  ansible.builtin.copy:
    content: "{{ pg_hba_conf.content | b64decode }}"
    dest: /var/lib/postgresql/17/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"

- name: Ensure conf.d directory exists for PostgreSQL
  ansible.builtin.file:
    path: /var/lib/postgresql/17/main/conf.d
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Deploy patroni.yml config
  ansible.builtin.template:
    src: templates/patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0644"

- name: Create systemd unit for Patroni
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service
    content: |
      [Unit]
      Description=Patroni PostgreSQL HA
      After=network.target

      [Service]
      Type=simple
      User=postgres
      ExecStart=/opt/patroni-venv/bin/patroni /etc/patroni/patroni.yml
      Restart=on-failure
      LimitNOFILE=1024

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start Patroni
  ansible.builtin.service:
    name: patroni
    enabled: true
    state: started

- name: Symlink patronictl to global path
  ansible.builtin.file:
    src: /opt/patroni-venv/bin/patronictl
    dest: /usr/local/bin/patronictl
    state: link
    force: true
  become: true
