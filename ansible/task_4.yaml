- name: Install HAProxy for Patroni
  hosts: haproxy1
  become: true
  pre_tasks:
    - name: Set Patroni cluster nodes as facts
      ansible.builtin.set_fact:
        patroni_nodes:
          - name: patroni-node1
            ip: "{{ hostvars['patroni-node1']['internal_host'] }}"
          - name: patroni-node2
            ip: "{{ hostvars['patroni-node2']['internal_host'] }}"
        haproxy_port: 5432
        restapi_port: 8008
  roles:
    - haproxy
